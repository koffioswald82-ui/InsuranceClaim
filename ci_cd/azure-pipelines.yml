trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "*.md"

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip

stages:
  # ────────────────────────────────────────────────────────────────────────────
  - stage: Lint
    displayName: "Lint & Format"
    jobs:
      - job: LintJob
        displayName: "black + flake8"
        pool:
          vmImage: "ubuntu-22.04"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(PYTHON_VERSION)"
              addToPath: true

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: 'pip | "$(Agent.OS)"'
              path: $(PIP_CACHE_DIR)
            displayName: "Cache pip dependencies"

          - script: |
              pip install black flake8 flake8-docstrings
            displayName: "Install lint tools"

          - script: |
              black --check --diff src/ generate_data.py monitoring/
            displayName: "black format check"

          - script: |
              flake8 src/ generate_data.py monitoring/ \
                --max-line-length=100 \
                --extend-ignore=E203,W503,D100,D101,D102,D103 \
                --exclude=__pycache__,*.egg-info
            displayName: "flake8 lint"

  # ────────────────────────────────────────────────────────────────────────────
  - stage: Test
    displayName: "Tests & Coverage"
    dependsOn: Lint
    jobs:
      - job: TestJob
        displayName: "pytest avec couverture"
        pool:
          vmImage: "ubuntu-22.04"
        variables:
          AXA_ENV: "local"
          AXA_LOG_FORMAT: "text"
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(PYTHON_VERSION)"
              addToPath: true

          - script: |
              sudo apt-get install -y openjdk-11-jdk
            displayName: "Install Java 11"

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: 'pip | "$(Agent.OS)"'
              path: $(PIP_CACHE_DIR)

          - script: |
              pip install -r requirements.txt
            displayName: "Install dependencies"

          - script: |
              python generate_data.py
            displayName: "Generate synthetic data"

          - script: |
              pytest src/quality/ \
                --cov=src \
                --cov-report=xml:coverage.xml \
                --cov-report=html:coverage_html \
                --cov-fail-under=70 \
                --junit-xml=test-results.xml \
                -v \
                --tb=short \
                -m "not integration"
            displayName: "Run unit tests with coverage"

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "test-results.xml"
              mergeTestResults: true
              testRunTitle: "AXA Lakehouse Tests"
            condition: always()

          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: "coverage.xml"
              reportDirectory: "coverage_html"
            displayName: "Publish coverage report"
            condition: always()

  # ────────────────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: "Build Python Wheel"
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildJob
        pool:
          vmImage: "ubuntu-22.04"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(PYTHON_VERSION)"

          - script: |
              pip install build twine
              python -m build --wheel
            displayName: "Build wheel package"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "dist/"
              artifact: "python-wheel"
              publishLocation: "pipeline"
            displayName: "Publish wheel artifact"

  # ────────────────────────────────────────────────────────────────────────────
  - stage: Deploy_Dev
    displayName: "Deploy → Dev"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: axa-lakehouse-dev
    jobs:
      - deployment: DeployDev
        displayName: "Databricks bundle deploy (dev)"
        pool:
          vmImage: "ubuntu-22.04"
        environment: "axa-lakehouse-dev"
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    pip install databricks-cli
                    databricks bundle deploy \
                      --target dev \
                      --var="environment=dev"
                  displayName: "Databricks bundle deploy (dev)"
                  env:
                    DATABRICKS_HOST:  $(DATABRICKS_HOST_DEV)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN_DEV)

  # ────────────────────────────────────────────────────────────────────────────
  - stage: Deploy_Prod
    displayName: "Deploy → Prod"
    dependsOn: Deploy_Dev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: axa-lakehouse-prod
    jobs:
      - deployment: DeployProd
        displayName: "Databricks bundle deploy (prod)"
        pool:
          vmImage: "ubuntu-22.04"
        environment: "axa-lakehouse-prod"
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    pip install databricks-cli
                    databricks bundle deploy \
                      --target prod \
                      --var="environment=prod"
                  displayName: "Databricks bundle deploy (prod)"
                  env:
                    DATABRICKS_HOST:  $(DATABRICKS_HOST_PROD)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN_PROD)
